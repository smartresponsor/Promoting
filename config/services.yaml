            $usageService: '@App\Promoting\ServiceInterface\PromotionCampaignUsageServiceInterface'

    App\Promoting\ServiceInterface\PromotionCheckoutApplicationServiceInterface:
        alias: App\Promoting\Service\PromotionCheckoutApplicationService

