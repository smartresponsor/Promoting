services:
    App\Promoting\Service\PromotionEvaluationService: ~

    App\Promoting\Service\PromotionApplicationService:
        arguments:
            $evaluationService: '@App\Promoting\ServiceInterface\PromotionEvaluationServiceInterface'

    App\Promoting\ServiceInterface\PromotionEvaluationServiceInterface:
        alias: App\Promoting\Service\PromotionEvaluationService

    App\Promoting\ServiceInterface\PromotionApplicationServiceInterface:
        alias: App\Promoting\Service\PromotionApplicationService

    App\Promoting\Service\PromotionCouponService: ~

    App\Promoting\ServiceInterface\PromotionCouponServiceInterface:
        alias: App\Promoting\Service\PromotionCouponService

    App\Promoting\Service\PromotionCouponIssuanceService: ~

    App\Promoting\ServiceInterface\PromotionCouponIssuanceServiceInterface:
        alias: App\Promoting\Service\PromotionCouponIssuanceService

    App\Promoting\Service\PromotionResolutionService:
        arguments:
            $applicationService: '@App\Promoting\ServiceInterface\PromotionApplicationServiceInterface'

    App\Promoting\ServiceInterface\PromotionResolutionServiceInterface:
        alias: App\Promoting\Service\PromotionResolutionService

    App\Promoting\Service\PromotionCampaignService: ~

    App\Promoting\ServiceInterface\PromotionCampaignServiceInterface:
        alias: App\Promoting\Service\PromotionCampaignService

    App\Promoting\Service\PromotionBenefitService:
        arguments:
            $evaluationService: '@App\Promoting\ServiceInterface\PromotionEvaluationServiceInterface'

    App\Promoting\ServiceInterface\PromotionBenefitServiceInterface:
        alias: App\Promoting\Service\PromotionBenefitService

    App\Promoting\Service\PromotionSelectionService:
        arguments:
            $evaluationService: '@App\Promoting\ServiceInterface\PromotionEvaluationServiceInterface'

    App\Promoting\ServiceInterface\PromotionSelectionServiceInterface:
        alias: App\Promoting\Service\PromotionSelectionService

    App\Promoting\Service\PromotionCouponResolutionService:
        arguments:
            $couponService: '@App\Promoting\ServiceInterface\PromotionCouponServiceInterface'
            $evaluationService: '@App\Promoting\ServiceInterface\PromotionEvaluationServiceInterface'

    App\Promoting\ServiceInterface\PromotionCouponResolutionServiceInterface:
        alias: App\Promoting\Service\PromotionCouponResolutionService

    App\Promoting\Service\PromotionCouponApplicationService:
        arguments:
            $resolutionService: '@App\Promoting\ServiceInterface\PromotionCouponResolutionServiceInterface'
            $applicationService: '@App\Promoting\ServiceInterface\PromotionApplicationServiceInterface'
            $couponService: '@App\Promoting\ServiceInterface\PromotionCouponServiceInterface'

    App\Promoting\ServiceInterface\PromotionCouponApplicationServiceInterface:
        alias: App\Promoting\Service\PromotionCouponApplicationService

